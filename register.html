<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Register</title>
		<link rel="stylesheet" href="auth.css" />
	</head>
	<body>
		<form id="register-form">
			<h2>Register now</h2>
			<input type="name" id="name" placeholder="Enter a full name" />
			<input type="email" id="email" placeholder="Enter a email" />
			<input type="password" id="password" placeholder="Type password" />
			<button>Register</button>

			<p class="auth-link">
				Already have account? <a href="login.html">Log in</a>
			</p>
			<div class="message"></div>
		</form>

		<script type="module" src="controller/AuthController.js"></script>
	</body>
</html>

<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>Reservation Dashboard</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<header class="header">
			<h1>Reservation Dashboard</h1>
			<h2 class="helloMsg"></h2>
			<button class="btn-logout" id="logoutBtn">Logout</button>
		</header>

		<main class="app">
			<aside class="filters">
				<h2>Filters</h2>

				<div class="filter-group">
					<p>Status</p>
					<button data-status="all" class="filter-btn active">All</button>
					<button data-status="available" class="filter-btn">Free</button>
					<button data-status="taken" class="filter-btn">Reserved</button>
				</div>

				<div class="filter-group">
					<p>Location</p>
					<button data-location="east" class="filter-btn">East</button>
					<button data-location="west" class="filter-btn">West</button>
					<button data-location="north" class="filter-btn">North</button>
					<button data-location="south" class="filter-btn">South</button>
				</div>
			</aside>

			<section class="content">
				<div class="grid" id="reservationGrid"></div>
			</section>
		</main>

		<div class="reservation modal modal-hidden">
			<form id="reservation-form">
				<h1>Enter guest:</h1>
				<h2>Min: 1</h2>
				<h2>Max: 9</h2>
				<input
					type="number"
					placeholder="Enter a guest number"
					id="guest_number"
				/>
				<button>Add guests</button>
			</form>
		</div>
		<div class="modal modal-hidden" id="reservationModal">
			<div class="modal-content">
				<h3 id="modalTitle">Reservation</h3>

				<div class="times"></div>

				<div class="modal-actions">
					<button class="btn-cancel">Cancel</button>
					<button class="btn-confirm">Reserve</button>
				</div>
			</div>
		</div>

		<script type="module" src="script.js"></script>
	</body>
</html>
